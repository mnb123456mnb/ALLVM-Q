name: Build ALLVM Q-Protector Toolchain (aarch64 Linux)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/abcdefgjh-li/ALLVM.git
  LLVM_OFFICIAL_REPO: https://github.com/llvm/llvm-project.git
  LLVM_OFFICIAL_BRANCH: release/21.x
  NDK_ZIP_URL: https://dl.google.com/android/repository/android-ndk-r29-linux.zip

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350

    steps:
      - name: Checkout this fork (modified files only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang lld zlib1g-dev libzstd-dev \
            python3 file unzip wget rsync libxml2-dev libedit-dev

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Assemble source (official LLVM 21.x base + ALLVM overlay + our branding)
        run: |
          set -e
          WS="$GITHUB_WORKSPACE"

          # 1. Save our fork's branded files
          rsync -a --exclude='.git' "$WS/" /tmp/our-fork/

          # 2. Clone official LLVM release/21.x as COMPLETE base (has all cmake infrastructure)
          git clone --depth 1 --branch "$LLVM_OFFICIAL_BRANCH" "$LLVM_OFFICIAL_REPO" /tmp/llvm-base

          # 3. Clone ALLVM upstream (has obfuscation passes + aVMPInterpreter)
          git clone --depth 1 "$UPSTREAM_REPO" /tmp/allvm-base

          # 4. Put official LLVM 21.x into workspace as base
          find "$WS" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/llvm-base/. "$WS/"
          rm -rf /tmp/llvm-base

          # 5. Overlay ALLVM-specific files on top (ALLVM wins for these paths)
          #    aVMPInterpreter (new dir, not in official LLVM)
          cp -a /tmp/allvm-base/aVMPInterpreter "$WS/"
          #    Obfuscation passes (new dir)
          mkdir -p "$WS/llvm/lib/Transforms/Obfuscation"
          cp -a /tmp/allvm-base/llvm/lib/Transforms/Obfuscation/. "$WS/llvm/lib/Transforms/Obfuscation/"
          #    Obfuscation headers (new dir)
          mkdir -p "$WS/llvm/include/llvm/Transforms/Obfuscation"
          cp -a /tmp/allvm-base/llvm/include/llvm/Transforms/Obfuscation/. "$WS/llvm/include/llvm/Transforms/Obfuscation/"
          #    Transforms CMakeLists (ALLVM adds add_subdirectory(Obfuscation))
          cp -f /tmp/allvm-base/llvm/lib/Transforms/CMakeLists.txt "$WS/llvm/lib/Transforms/CMakeLists.txt"
          #    PassBuilderPipelines (ALLVM adds obfuscation pass manager)
          cp -f /tmp/allvm-base/llvm/lib/Passes/PassBuilderPipelines.cpp "$WS/llvm/lib/Passes/PassBuilderPipelines.cpp"
          #    Clang Version.cpp (ALLVM adds brand output)
          cp -f /tmp/allvm-base/clang/lib/Basic/Version.cpp "$WS/clang/lib/Basic/Version.cpp"
          #    Clang ELFWrapper (ALLVM adds ELF wrapper)
          cp -f /tmp/allvm-base/clang/lib/Driver/ELFWrapper.cpp "$WS/clang/lib/Driver/ELFWrapper.cpp"
          cp -f /tmp/allvm-base/clang/lib/Driver/CMakeLists.txt "$WS/clang/lib/Driver/CMakeLists.txt"
          #    Clang Options.td (ALLVM adds -firobf flags)
          cp -f /tmp/allvm-base/clang/include/clang/Driver/Options.td "$WS/clang/include/clang/Driver/Options.td"
          #    Root-level ALLVM files
          cp -f /tmp/allvm-base/build.cpp "$WS/" 2>/dev/null || true
          cp -f /tmp/allvm-base/build.exe "$WS/" 2>/dev/null || true
          cp -f /tmp/allvm-base/compile_build.bat "$WS/" 2>/dev/null || true
          cp -f /tmp/allvm-base/qq.jpg "$WS/" 2>/dev/null || true
          #    clang-tools-extra if ALLVM has it
          cp -f /tmp/allvm-base/clang/lib/Basic/CMakeLists.txt "$WS/clang/lib/Basic/CMakeLists.txt" 2>/dev/null || true
          cp -f /tmp/allvm-base/llvm/lib/Passes/CMakeLists.txt "$WS/llvm/lib/Passes/CMakeLists.txt" 2>/dev/null || true
          rm -rf /tmp/allvm-base

          # 6. Overlay our branded files on top (Q-Protector branding wins over ALLVM)
          rsync -a --exclude='.git' /tmp/our-fork/ "$WS/"
          rm -rf /tmp/our-fork

          # Verify assembly
          echo "=== cmake/Modules count ==="
          ls "$WS/cmake/Modules/" | wc -l
          echo "=== llvm/cmake/modules count ==="
          ls "$WS/llvm/cmake/modules/" | wc -l
          echo "=== Obfuscation dir ==="
          ls "$WS/llvm/lib/Transforms/Obfuscation/" | head -5
          echo "=== Config files ==="
          ls "$WS/llvm/include/llvm/Config/"
          echo "=== branding check ==="
          grep -c "Q-Protector" "$WS/aVMPInterpreter/aVMPInterpreter.cpp"
          grep -c "Q-Protector" "$WS/llvm/lib/Transforms/Obfuscation/DetectUtils.cpp"
          echo "ASSEMBLE_DONE"

      - name: Verify critical files
        run: |
          set -e
          missing=0
          for f in \
            cmake/Modules/CMakePolicy.cmake \
            cmake/Modules/LLVMVersion.cmake \
            llvm/cmake/modules/AddLLVM.cmake \
            llvm/cmake/modules/HandleLLVMOptions.cmake \
            llvm/cmake/modules/GetLibraryName.cmake \
            llvm/cmake/modules/TableGen.cmake \
            llvm/cmake/modules/LLVMProcessSources.cmake \
            llvm/cmake/modules/LLVMDistributionSupport.cmake \
            llvm/include/llvm/Config/config.h.cmake \
            llvm/include/llvm/Config/llvm-config.h.cmake \
            llvm/include/llvm/Config/abi-breaking.h.cmake \
            llvm/lib/Transforms/Obfuscation/CMakeLists.txt \
            llvm/lib/Transforms/Obfuscation/DetectUtils.cpp \
            llvm/lib/Transforms/Obfuscation/AProtect.cpp \
            llvm/include/llvm/Transforms/Obfuscation/aVMP/vm.h \
            lld/cmake/modules/AddLLD.cmake \
            clang/cmake/modules/AddClang.cmake \
            aVMPInterpreter/aVMPInterpreter.cpp ; do
            if [ -f "$f" ]; then echo "OK   $f"; else echo "MISS $f"; missing=1; fi
          done
          grep -q "Q-Protector" aVMPInterpreter/aVMPInterpreter.cpp
          grep -q "Q-Protector" llvm/lib/Transforms/Obfuscation/DetectUtils.cpp
          grep -q "Q-Protector" llvm/lib/Transforms/Obfuscation/AProtect.cpp
          grep -q "wsq520a" clang/lib/Basic/Version.cpp
          echo "Branding verification passed"
          exit $missing

      - name: Download official NDK (sysroot + wrapper scripts)
        run: |
          set -e
          cd $RUNNER_TEMP
          wget -q "$NDK_ZIP_URL" -O ndk.zip
          unzip -q ndk.zip
          NDK_DIR=$(echo android-ndk-*)
          echo "NDK_PREBUILT=$RUNNER_TEMP/$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV

      - name: Rebuild aVMPInterpreter.bc (Q-Protector branding)
        run: |
          set -e
          clang -O2 -emit-llvm -c aVMPInterpreter/aVMPInterpreter.cpp \
            -o aVMPInterpreter/aVMPInterpreter.bc \
            -target aarch64-linux-android21 --sysroot="$NDK_PREBUILT/sysroot"
          file aVMPInterpreter/aVMPInterpreter.bc
          strings aVMPInterpreter/aVMPInterpreter.bc | grep -c "Q-Protector" || true

      - name: Regenerate vm.h from new .bc
        run: |
          python3 - <<'PY'
          data = open('aVMPInterpreter/aVMPInterpreter.bc','rb').read()
          with open('llvm/include/llvm/Transforms/Obfuscation/aVMP/vm.h','w') as f:
              f.write('#include <string>\n#include <vector>\n\n')
              f.write('static const int binary_ir_length = %d;\n' % len(data))
              f.write('static const char binary_ir_data[] =\n')
              line = ''
              for i, b in enumerate(data):
                  if i % 16 == 0:
                      line = '"'
                  line += '\\x%02x' % b
                  if i % 16 == 15:
                      f.write(line + '"\n')
                      line = ''
              if len(data) % 16 != 0:
                  f.write(line + '"')
              f.write(';\n\n')
              f.write('static std::vector<char> get_binary_ir() {\n')
              f.write('    return std::vector<char>(binary_ir_data, binary_ir_data + binary_ir_length);\n')
              f.write('}\n')
          print('vm.h generated:', len(data), 'bytes')
          PY

      - name: Configure CMake
        run: |
          cmake -G Ninja -B build -S llvm \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86" \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=2

      - name: Build clang / lld / binutils (aarch64 host)
        run: |
          ninja -C build clang lld llvm-strip llvm-objcopy llvm-ar llvm-nm llvm-ranlib \
            llvm-objdump llvm-readelf llvm-readobj llvm-size llvm-strings llvm-as llvm-dis \
            llvm-link llvm-symbolizer llvm-profdata llc opt
          df -h /

      - name: Validate Q-Protector branding & obfuscation passes
        run: |
          set -e
          build/bin/clang --version | head -2
          cat > /tmp/qp_test.cpp <<'EOF'
          #include <stdio.h>
          int main() { printf("QP_TEST_OK\n"); return 0; }
          EOF
          build/bin/clang -O1 -mllvm -irobf-vpn -mllvm -irobf-fla -mllvm -level-fla=3 \
            -o /tmp/qp_test /tmp/qp_test.cpp
          /tmp/qp_test | tee /tmp/qp_out.txt
          grep -q "QP_TEST_OK" /tmp/qp_out.txt
          strings /tmp/qp_test | grep -q "Q-Protector"
          strings /tmp/qp_test | grep -q "version: 1.0.0"
          strings /tmp/qp_test | grep -q "请关闭你的vpn"
          echo VALIDATION_OK

      - name: Package toolchain-only
        run: |
          set -e
          mkdir -p pkg/allvm-q-toolchain-aarch64/bin
          for t in clang clang++ clang-21 lld ld.lld ld64.lld wasm-ld \
            llvm-ar llvm-nm llvm-ranlib llvm-strip llvm-objcopy llvm-objdump \
            llvm-readelf llvm-readobj llvm-size llvm-strings llvm-as llvm-dis \
            llvm-link llvm-symbolizer llvm-profdata llc opt ; do
            if [ -f "build/bin/$t" ]; then cp "build/bin/$t" pkg/allvm-q-toolchain-aarch64/bin/; fi
          done
          build/bin/llvm-strip pkg/allvm-q-toolchain-aarch64/bin/* 2>/dev/null || true
          cp LICENSE.TXT pkg/allvm-q-toolchain-aarch64/ 2>/dev/null || true
          tar czf allvm-q-toolchain-aarch64.tar.gz -C pkg allvm-q-toolchain-aarch64
          ls -lh allvm-q-toolchain-aarch64.tar.gz

      - name: Package full NDK (sysroot + aarch64 toolchain + wrappers)
        run: |
          set -e
          NDK_PKG=$RUNNER_TEMP/ndk-pkg/android-ndk-allvm-q
          PREBUILT=$NDK_PKG/toolchains/llvm/prebuilt/linux-aarch64
          mkdir -p "$PREBUILT/bin"
          cp -r "$NDK_PREBUILT/sysroot" "$PREBUILT/sysroot"
          for t in clang clang++ clang-21 lld ld.lld wasm-ld \
            llvm-ar llvm-nm llvm-ranlib llvm-strip llvm-objcopy llvm-objdump \
            llvm-readelf llvm-readobj llvm-size llvm-strings llvm-as llvm-dis \
            llvm-link llvm-symbolizer llvm-profdata llc opt ; do
            if [ -f "build/bin/$t" ]; then cp "build/bin/$t" "$PREBUILT/bin/"; fi
          done
          build/bin/llvm-strip "$PREBUILT/bin/"* 2>/dev/null || true
          for f in "$NDK_PREBUILT/bin/"*; do
            if head -c 2 "$f" | grep -q '#!'; then cp "$f" "$PREBUILT/bin/"; fi
          done
          cp "$NDK_PREBUILT/../../source.properties" "$NDK_PKG/" 2>/dev/null || true
          tar czf allvm-q-ndk-aarch64.tar.gz -C "$RUNNER_TEMP/ndk-pkg" android-ndk-allvm-q
          ls -lh allvm-q-ndk-aarch64.tar.gz

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Q-Protector ALLVM Toolchain v1.0.0 (aarch64 Linux)
          files: |
            allvm-q-toolchain-aarch64.tar.gz
            allvm-q-ndk-aarch64.tar.gz