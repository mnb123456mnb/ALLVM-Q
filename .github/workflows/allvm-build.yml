name: Build ALLVM Q-Protector Toolchain (aarch64 Linux)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/abcdefgjh-li/ALLVM.git
  NDK_ZIP_URL: https://dl.google.com/android/repository/android-ndk-r29-linux.zip

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350

    steps:
      - name: Checkout this fork (modified files only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone upstream ALLVM as base source
        run: |
          set -e
          # Save our fork's modified files (checkout content) to temp
          rsync -a --exclude='.git' "$GITHUB_WORKSPACE/" /tmp/our-fork/
          # Clone upstream (full LLVM monorepo with ALLVM obfuscation passes)
          git clone --depth 1 "$UPSTREAM_REPO" /tmp/allvm-base
          # ALLVM repo is missing cmake/Modules/ — clone from official LLVM
          git clone --depth 1 --sparse https://github.com/llvm/llvm-project.git /tmp/llvm-upstream
          cd /tmp/llvm-upstream && git sparse-checkout set cmake/Modules
          cp -r cmake/Modules /tmp/llvm-cmake-Modules
          cd /tmp/allvm-base
          mkdir -p cmake
          cp -r /tmp/llvm-cmake-Modules cmake/Modules
          rm -rf /tmp/llvm-upstream /tmp/llvm-cmake-Modules
          # Clear workspace (keep .git for actions)
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          # Copy upstream content into workspace
          cp -a /tmp/allvm-base/. "$GITHUB_WORKSPACE/"
          rm -rf /tmp/allvm-base
          # Overlay our modified files on top of upstream (our versions take priority)
          rsync -a --exclude='.git' /tmp/our-fork/ "$GITHUB_WORKSPACE/"
          # Restore .github (our workflow, not upstream's)
          rm -rf "$GITHUB_WORKSPACE/.github"
          cp -a /tmp/our-fork/.github "$GITHUB_WORKSPACE/.github"
          rm -rf /tmp/our-fork
          cd "$GITHUB_WORKSPACE"
          echo "=== Source assembled ==="
          ls -la
          echo "=== cmake check ==="
          ls cmake/Modules/ | head -10 || echo "NO cmake/Modules"
          echo "=== llvm cmake check ==="
          ls llvm/cmake/modules/ | head -5 || echo "NO llvm/cmake/modules"
          echo "=== branding check ==="
          grep -c "Q-Protector" aVMPInterpreter/aVMPInterpreter.cpp
          grep -c "Q-Protector" llvm/lib/Transforms/Obfuscation/DetectUtils.cpp

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang lld zlib1g-dev libzstd-dev python3 file unzip wget rsync

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Verify critical files (previous-failure regression check)
        run: |
          set -e
          missing=0
          for f in \
            cmake/Modules/CMakePolicy.cmake \
            cmake/Modules/LLVMVersion.cmake \
            llvm/cmake/modules/CMakeLists.txt \
            llvm/cmake/modules/LLVMConfig.cmake.in \
            llvm/include/llvm/Config/config.h.cmake \
            llvm/include/llvm/Config/Targets.def.in \
            llvm/lib/Transforms/Obfuscation/CMakeLists.txt \
            llvm/include/llvm/Transforms/Obfuscation/aVMP/vm.h \
            aVMPInterpreter/aVMPInterpreter.cpp ; do
            if [ -f "$f" ]; then echo "OK   $f"; else echo "MISS $f"; missing=1; fi
          done
          # Also verify our branding changes are present
          grep -q "Q-Protector" aVMPInterpreter/aVMPInterpreter.cpp
          grep -q "Q-Protector" llvm/lib/Transforms/Obfuscation/DetectUtils.cpp
          grep -q "Q-Protector" llvm/lib/Transforms/Obfuscation/AProtect.cpp
          grep -q "wsq520a" clang/lib/Basic/Version.cpp
          echo "Branding verification passed"
          exit $missing

      - name: Download official NDK (sysroot + wrapper scripts)
        run: |
          set -e
          cd $RUNNER_TEMP
          wget -q "$NDK_ZIP_URL" -O ndk.zip
          unzip -q ndk.zip
          NDK_DIR=$(echo android-ndk-*)
          echo "NDK_PREBUILT=$RUNNER_TEMP/$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV

      - name: Rebuild aVMPInterpreter.bc (Q-Protector branding)
        run: |
          set -e
          cd aVMPInterpreter
          clang -O2 -emit-llvm -c aVMPInterpreter.cpp -o aVMPInterpreter.bc \
            -target aarch64-linux-android21 --sysroot="$NDK_PREBUILT/sysroot"
          file aVMPInterpreter.bc
          strings aVMPInterpreter.bc | grep -c "Q-Protector" || true

      - name: Regenerate vm.h from new .bc
        run: |
          python3 - <<'PY'
          data = open('aVMPInterpreter/aVMPInterpreter.bc','rb').read()
          with open('llvm/include/llvm/Transforms/Obfuscation/aVMP/vm.h','w') as f:
              f.write('#include <string>\n#include <vector>\n\n')
              f.write('static const int binary_ir_length = %d;\n' % len(data))
              f.write('static const char binary_ir_data[] =\n')
              line = ''
              for i, b in enumerate(data):
                  if i % 16 == 0:
                      line = '"'
                  line += '\\x%02x' % b
                  if i % 16 == 15:
                      f.write(line + '"\n')
                      line = ''
              if len(data) % 16 != 0:
                  f.write(line + '"')
              f.write(';\n\n')
              f.write('static std::vector<char> get_binary_ir() {\n')
              f.write('    return std::vector<char>(binary_ir_data, binary_ir_data + binary_ir_length);\n')
              f.write('}\n')
          print('vm.h generated:', len(data), 'bytes')
          PY

      - name: Configure CMake
        run: |
          cmake -G Ninja -B build -S llvm \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86" \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=2

      - name: Build clang / lld / binutils (aarch64 host)
        run: |
          ninja -C build clang lld llvm-strip llvm-objcopy llvm-ar llvm-nm llvm-ranlib \
            llvm-objdump llvm-readelf llvm-readobj llvm-size llvm-strings llvm-as llvm-dis \
            llvm-link llvm-symbolizer llvm-profdata llc opt
          df -h /

      - name: Validate Q-Protector branding & obfuscation passes
        run: |
          set -e
          build/bin/clang --version | head -2
          cat > /tmp/qp_test.cpp <<'EOF'
          #include <stdio.h>
          int main() { printf("QP_TEST_OK\n"); return 0; }
          EOF
          build/bin/clang -O1 -mllvm -irobf-vpn -mllvm -irobf-fla -mllvm -level-fla=3 \
            -o /tmp/qp_test /tmp/qp_test.cpp
          /tmp/qp_test | tee /tmp/qp_out.txt
          grep -q "QP_TEST_OK" /tmp/qp_out.txt
          strings /tmp/qp_test | grep -q "Q-Protector"
          strings /tmp/qp_test | grep -q "version: 1.0.0"
          strings /tmp/qp_test | grep -q "请关闭你的vpn"
          echo VALIDATION_OK

      - name: Package toolchain-only
        run: |
          set -e
          mkdir -p pkg/allvm-q-toolchain-aarch64/bin
          for t in clang clang++ clang-21 lld ld.lld ld64.lld wasm-ld \
            llvm-ar llvm-nm llvm-ranlib llvm-strip llvm-objcopy llvm-objdump \
            llvm-readelf llvm-readobj llvm-size llvm-strings llvm-as llvm-dis \
            llvm-link llvm-symbolizer llvm-profdata llc opt ; do
            if [ -f "build/bin/$t" ]; then cp "build/bin/$t" pkg/allvm-q-toolchain-aarch64/bin/; fi
          done
          build/bin/llvm-strip pkg/allvm-q-toolchain-aarch64/bin/* 2>/dev/null || true
          cp LICENSE.TXT pkg/allvm-q-toolchain-aarch64/ 2>/dev/null || true
          tar czf allvm-q-toolchain-aarch64.tar.gz -C pkg allvm-q-toolchain-aarch64
          ls -lh allvm-q-toolchain-aarch64.tar.gz

      - name: Package full NDK (sysroot + aarch64 toolchain + wrappers)
        run: |
          set -e
          NDK_PKG=$RUNNER_TEMP/ndk-pkg/android-ndk-allvm-q
          PREBUILT=$NDK_PKG/toolchains/llvm/prebuilt/linux-aarch64
          mkdir -p "$PREBUILT/bin"
          cp -r "$NDK_PREBUILT/sysroot" "$PREBUILT/sysroot"
          for t in clang clang++ clang-21 lld ld.lld wasm-ld \
            llvm-ar llvm-nm llvm-ranlib llvm-strip llvm-objcopy llvm-objdump \
            llvm-readelf llvm-readobj llvm-size llvm-strings llvm-as llvm-dis \
            llvm-link llvm-symbolizer llvm-profdata llc opt ; do
            if [ -f "build/bin/$t" ]; then cp "build/bin/$t" "$PREBUILT/bin/"; fi
          done
          build/bin/llvm-strip "$PREBUILT/bin/"* 2>/dev/null || true
          # Copy platform-independent wrapper scripts from official NDK
          for f in "$NDK_PREBUILT/bin/"*; do
            if head -c 2 "$f" | grep -q '#!'; then cp "$f" "$PREBUILT/bin/"; fi
          done
          cp "$NDK_PREBUILT/../../source.properties" "$NDK_PKG/" 2>/dev/null || true
          tar czf allvm-q-ndk-aarch64.tar.gz -C "$RUNNER_TEMP/ndk-pkg" android-ndk-allvm-q
          ls -lh allvm-q-ndk-aarch64.tar.gz

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Q-Protector ALLVM Toolchain v1.0.0 (aarch64 Linux)
          files: |
            allvm-q-toolchain-aarch64.tar.gz
            allvm-q-ndk-aarch64.tar.gz